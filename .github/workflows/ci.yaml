name: CI Tests

on:
  pull_request:

jobs:
  ci-workflow:
    name: CI
    uses: Leuchtfeuer/mautic-ci-runner/.github/workflows/complete-ci.yaml@mtc-11409-custom-tests
    with:
      additionalRequirements: 'jeremykendall/php-domain-parser:"^6.3"'
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
